name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quick-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Basic syntax check
      run: |
        python -m py_compile app_flask.py
        python -c "import app_flask; print('✓ Flask app imports successfully')"

    - name: Check configuration
      run: |
        python -c "from config import Config; Config.validate(); print('✓ Configuration is valid')"

  pr-info:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get changed files
      run: |
        echo "## Changed Files" >> $GITHUB_STEP_SUMMARY
        git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} >> $GITHUB_STEP_SUMMARY

    - name: Count test files
      run: |
        TEST_COUNT=$(find tests/ -name "test_*.py" | wc -l)
        echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo "Total test files: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY

    - name: Check for new test files
      run: |
        NEW_TESTS=$(git diff --name-only --diff-filter=A ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep "tests/test_" || true)
        if [ -n "$NEW_TESTS" ]; then
          echo "## New Test Files Added ✅" >> $GITHUB_STEP_SUMMARY
          echo "$NEW_TESTS" >> $GITHUB_STEP_SUMMARY
        else
          echo "## No New Test Files" >> $GITHUB_STEP_SUMMARY
        fi